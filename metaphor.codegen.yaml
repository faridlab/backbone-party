# Codegen policy for party.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # Validated write path + guarded route composition.
  - "src/application/service/party_write_service.rs"
  # Fail-closed cross-border VAT validation (country format table, GR->EL alias, BE mod-97,
  # no-VAT sentinel, named unknown-country escape).
  - "src/application/service/party_vat_validation.rs"
  - "src/presentation/http/guarded_routes.rs"
  # Own the hand-written party SQL (the validated write path's existence probe, the
  # party + child inserts, and the per-child primary switch) that party_write_service orchestrates.
  # Declared here — not renamed with a `_custom` suffix — so the generator skips them wholesale;
  # this declaration is what makes editing them legitimate.
  - "src/infrastructure/persistence/party_repository.rs"
  - "src/infrastructure/persistence/party_address_repository.rs"
  - "src/infrastructure/persistence/party_contact_repository.rs"
  - "src/infrastructure/persistence/party_email_repository.rs"
  - "src/infrastructure/persistence/party_phone_repository.rs"

  # Hand-authored migrations (the tenant-scope RLS, the shared-blank fence flip, the VAT column).
  - "migrations/20260901120000_add_party_vat.up.sql"
  - "migrations/20260901120000_add_party_vat.down.sql"

  # Behavior tests (the golden cases / oracle) + route-level probes + BDD features.
  - "tests/party_golden_cases.rs"
  - "tests/vat_probes.rs"
  - "tests/integrity_probes.rs"
  - "tests/features/**"

  # The integration-test target root — a module-declaration stub made user-owned so its
  # crate-root lint expectation (the expect_used instrumented allow) covers the generated
  # scaffold under tests/integration/ without editing generator-owned files.
  - "tests/integration_tests.rs"

  # Hand-authored module documentation.
  - "docs/**"
